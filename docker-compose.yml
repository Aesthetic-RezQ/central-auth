services:
  db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d central_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build: ./backend
    container_name: auth-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${POSTGRES_PASSWORD:-change-me}@db:5432/central_auth
    depends_on:
      db:
        condition: service_healthy

  auth-web:
    image: nginx:1.27-alpine
    container_name: auth-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./css:/opt/bic-css:ro
      - ./js:/opt/bic-js:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-api

volumes:
  auth-db-data:
