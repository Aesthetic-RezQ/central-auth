server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /css/ {
        alias /opt/bic-css/;
    }

    location /js/ {
        alias /opt/bic-js/;
    }

    location /api/ {
        proxy_pass http://auth-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://auth-api:8000/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://auth-api:8000/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://auth-api:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://auth-api:8000/openapi.json;
    }

    location = /health {
        proxy_pass http://auth-api:8000/health;
    }

    location = /ready {
        proxy_pass http://auth-api:8000/ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

